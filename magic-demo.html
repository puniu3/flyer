<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>変身音の比較 · Flyer Dungeon</title>
</head>
<body>
  <main>
    <header><a href="./">← ゲーム</a><h1>変身音の比較</h1><p>4つの方向を同じ音量で比較。ゲーム本体への採用はまだしていません。</p></header>
    <section class="candidates" aria-label="変身音の候補">
      <article><span class="letter">A</span><h2>弾む変身</h2><p>バネのように音程が伸び縮みする。</p><button data-cue="a">▶ 聴く</button></article>
      <article><span class="letter">B</span><h2>とろける変身</h2><p>一度とけて、別の形に戻る。</p><button data-cue="b">▶ 聴く</button></article>
      <article><span class="letter">C</span><h2>手品の変身</h2><p>音程がひるがえり、ぽんと現れる。</p><button data-cue="c">▶ 聴く</button></article>
      <article><span class="letter">D</span><h2>組み替わる変身</h2><p>小さな仕掛けが一気に組み替わる。</p><button data-cue="d">▶ 聴く</button></article>
    </section>
    <footer><button data-cue="current">現行と比較</button><button id="stop">停止</button><label>音量 <input id="volume" type="range" min="0" max="1" step=".01" value=".55" /></label><p id="status" role="status" aria-live="polite">A〜Dを押して比較できます。</p></footer>
  </main>
  <script type="module" src="/src/magic-demo.ts"></script>
</body>
</html>
