<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>魔法の「ティルン」の比較 · Flyer Dungeon</title>
</head>
<body>
  <main>
    <header><a href="./">← ゲーム</a><h1>魔法の「ティルン」の比較</h1><p>Bのチェレスタをゲーム本体に採用しました。</p></header>
    <section class="candidates" aria-label="魔法の「ティルン」の候補">
      <article><span class="letter">A</span><h2>澄んだクリスタル</h2><p>透明なベルの、明るい「ティリン」。</p><button data-cue="a">▶ 聴く</button></article>
      <article><span class="letter">B</span><h2>温かなチェレスタ（採用）</h2><p>オルゴールのような、丸い「ティルン」。</p><button data-cue="b">▶ 聴く</button></article>
      <article><span class="letter">C</span><h2>軽やかな銀の鈴</h2><p>細い弦と小さな鈴の「ティリン」。</p><button data-cue="c">▶ 聴く</button></article>
      <article><span class="letter">D</span><h2>柔らかな魔法音</h2><p>淡い倍音が広がる「ティルン」。</p><button data-cue="d">▶ 聴く</button></article>
    </section>
    <footer><button data-cue="current">現行と比較</button><button id="stop">停止</button><label>音量 <input id="volume" type="range" min="0" max="1" step=".01" value=".55" /></label><p id="status" role="status" aria-live="polite">A〜Dを押して比較できます。</p></footer>
  </main>
  <script type="module" src="/src/magic-demo.ts"></script>
</body>
</html>
